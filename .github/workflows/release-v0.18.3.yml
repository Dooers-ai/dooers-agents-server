name: Release v0.18.3

on:
  push:
    branches: [release/v0.18.3]
    paths: ['.github/workflows/release-v0.18.3.yml']

permissions:
  contents: read
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch trusted PyPI publisher on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo Dooers-ai/dooers-agents-server --ref main
