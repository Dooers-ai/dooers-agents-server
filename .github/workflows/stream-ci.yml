name: SDK CI
on:
  push:
    branches: [feat/realtime-chat-stream-20261030]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --extra observability
      - run: uv run pytest -q
      - run: uv run ruff check src/dooers/agents/server/handlers/send.py src/dooers/agents/server/handlers/pipeline.py src/dooers/agents/server/handlers/router.py src/dooers/agents/server/protocol/frames.py src/dooers/tools/rag/runtime.py tests/test_text_delta.py --select F,E4,E7,E9
